name: Tests

on:
  pull_request:
  push:
    branches: [revola/self-host]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# No secrets and no database: every suite mocks its database and external services.
env:
  CI: 'true'
  CHECKPOINT_DISABLE: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The whole jest suite, src/auth, src/throttle and src/health included.
          - suite: api (jest)
            directory: apps/api
            command: npx jest --ci
          - suite: app (vitest)
            directory: apps/app
            command: npx vitest run
          - suite: portal (vitest)
            directory: apps/portal
            command: npx vitest run
          - suite: db (bun test)
            directory: packages/db
            command: bun test src scripts
          - suite: deploy-aws (bun test)
            directory: deploy/aws
            command: bun test
          # scripts/tests/*.test.sh: bash, coreutils and openssl only.
          - suite: shell scripts
            directory: .
            command: bun run test:shell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Run ${{ matrix.suite }}
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}
