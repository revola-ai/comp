name: Check types
on:
  workflow_call:
env:
  NODE_OPTIONS: --max-old-space-size=4096
permissions:
  contents: read
jobs:
  check-types:
    runs-on: warp-ubuntu-latest-arm64-4x
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dangerous-git-checkout
      - uses: ./.github/actions/bun-install
      - name: Show info
        run: node -e "console.log(require('v8').getHeapStatistics())"
      - name: Configure TSC problem matcher
        run: |
          echo "::remove-matcher owner=tsc::"
          echo "::add-matcher::.github/matchers/tsc-absolute.json"
      # typecheck:ci excludes @trycompai/framework-editor: it has about 316 pre-existing
      # type errors (2026-10-06). Follow-up: fix them and drop the exclusion in package.json.
      - run: bun run typecheck:ci
